<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tu pauta de ejercicios · HEAL</title>
<meta name="theme-color" content="#0F6B5C" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap');

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #F5F6F2;
  color: #16232E;
  font-family: 'Inter', sans-serif;
}

h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin: 0; }

#wrap {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.header {
  text-align: center;
  padding: 10px 0 20px;
}
.header img { height: 44px; width: auto; margin-bottom: 10px; }
.header h1 { font-size: 19px; }
.header p { margin: 4px 0 0; font-size: 13.5px; color: #55636D; }

.note {
  background: #E4F1EE;
  color: #0B4F45;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
  margin-bottom: 18px;
  line-height: 1.5;
}

.ex-card {
  background: #fff;
  border: 1px solid #DCE1DA;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}
.ex-title { font-size: 15.5px; font-weight: 500; margin-bottom: 10px; }
.dosis-pill {
  display: inline-block;
  font-size: 12.5px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 999px;
  background: #FCEAE3;
  color: #A5341C;
  margin-bottom: 12px;
}
.video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  border-radius: 10px;
  overflow: hidden;
  background: #16232E;
}
.video-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 0;
}
.video-link {
  display: block;
  text-align: center;
  padding: 14px;
  background: #16232E;
  color: #fff;
  border-radius: 10px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #55636D;
}
.empty-state h2 { font-size: 16px; margin-bottom: 8px; }
.empty-state p { font-size: 13.5px; }

.footer {
  text-align: center;
  font-size: 12px;
  color: #8B969D;
  margin-top: 24px;
}
</style>
</head>

    <h1 id="titulo-paciente">Tu pauta de ejercicios</h1>
    <p id="sub-paciente">HEAL Sport Therapy & Wellness</p>
  </div>

  <div id="note-box"></div>
  <div id="lista-ejercicios"></div>

</div>

<div class="footer" id="footer" style="display:none;">
  Cualquier duda, contacta a tu kinesiólogo.
</div>

<script>
function b64UrlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function render() {
  const params = new URLSearchParams(window.location.search);
  const r = params.get('r');
  const wrap = document.getElementById('wrap');

  if (!r) {
    document.getElementById('lista-ejercicios').innerHTML = `
      <div class="empty-state">
        <h2>No encontramos tu pauta</h2>
        <p>Revisa que hayas abierto el link completo que te envió tu kinesiólogo.</p>
      </div>`;
    return;
  }

  let data;
  try {
    data = JSON.parse(b64UrlDecode(r));
  } catch (e) {
    document.getElementById('lista-ejercicios').innerHTML = `
      <div class="empty-state">
        <h2>Este link no se pudo abrir</h2>
        <p>Pídele a tu kinesiólogo que te reenvíe el link.</p>
      </div>`;
    return;
  }

  if (data.p) {
    document.getElementById('titulo-paciente').textContent = 'Hola ' + data.p;
  }

  if (data.no) {
    document.getElementById('note-box').innerHTML = `<div class="note">${escapeHtml(data.no)}</div>`;
  }

  const ejercicios = data.e || [];
  if (ejercicios.length === 0) {
    document.getElementById('lista-ejercicios').innerHTML = `
      <div class="empty-state">
        <h2>Aún no hay ejercicios en esta pauta</h2>
      </div>`;
    return;
  }

  document.getElementById('lista-ejercicios').innerHTML = ejercicios.map(ex => {
    let videoHtml;
    if (ex.y) {
      videoHtml = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${escapeHtml(ex.y)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (ex.u) {
      videoHtml = `<a class="video-link" href="${escapeHtml(ex.u)}" target="_blank" rel="noopener">Ver video ↗</a>`;
    } else {
      videoHtml = '';
    }
    const dosis = [ex.s, ex.d].filter(Boolean).join(' × ');
    return `
      <div class="ex-card">
        <div class="ex-title">${escapeHtml(ex.n)}</div>
        ${dosis ? `<div class="dosis-pill">${escapeHtml(dosis)}</div>` : ''}
        ${videoHtml}
      </div>`;
  }).join('');

  document.getElementById('footer').style.display = 'block';
}

render();
</script>
