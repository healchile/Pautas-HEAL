<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pauta HEAL</title>
<meta name="theme-color" content="#0F6B5C" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pauta HEAL" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #F5F6F2;
  --surface: #FFFFFF;
  --ink: #16232E;
  --ink-soft: #55636D;
  --ink-faint: #8B969D;
  --line: #DCE1DA;
  --teal: #0F6B5C;
  --teal-deep: #0B4F45;
  --teal-tint: #E4F1EE;
  --coral: #E2502F;
  --coral-tint: #FCEAE3;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin: 0; }
.mono { font-family: 'IBM Plex Mono', monospace; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 14px 16px calc(90px + var(--safe-bottom));
  position: relative;
}

.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0 16px;
}
.top img { height: 32px; width: auto; }
.top h1 { font-size: 17px; }
.top p { margin: 1px 0 0; font-size: 12px; color: var(--ink-soft); }

.step-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 20px 0 8px;
}
.step-label:first-of-type { margin-top: 4px; }

input[type="text"] {
  width: 100%;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
}
input[type="text"]:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-tint);
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 500;
  font-size: 13.5px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
}
.chip.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.chip.empty-hint { color: var(--ink-faint); font-style: italic; border-style: dashed; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 4px;
}
.ex-card {
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  position: relative;
  transition: border-color .12s ease;
}
.ex-card.selected { border-color: var(--teal); background: var(--teal-tint); }
.ex-thumb {
  height: 54px;
  border-radius: 8px;
  background: var(--teal-tint);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--teal-deep);
  font-size: 20px;
  margin-bottom: 8px;
}
.ex-card.selected .ex-thumb { background: var(--teal); color: #fff; }
.ex-name { font-size: 13px; font-weight: 500; line-height: 1.25; }
.ex-cat { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }
.ex-check {
  position: absolute;
  top: 8px; right: 8px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.ex-card.selected .ex-check { display: flex; }

.empty { text-align: center; padding: 28px 12px; color: var(--ink-faint); font-size: 13.5px; }

.sel-row {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.sel-row .name { flex: 1; font-size: 13.5px; font-weight: 500; line-height: 1.25; }
.sel-row .dosis-input {
  width: 46px;
  text-align: center;
  padding: 7px 4px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 13.5px;
  font-family: 'IBM Plex Mono', monospace;
}
.sel-row .x { color: var(--ink-faint); font-size: 12px; }
.sel-row .rm {
  border: none;
  background: none;
  color: var(--coral);
  font-size: 18px;
  line-height: 1;
  padding: 4px 6px;
  cursor: pointer;
}

.note-box textarea {
  width: 100%;
  min-height: 56px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  resize: vertical;
}

.bottom-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  margin: 0 auto;
  background: rgba(245,246,242,0.94);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + var(--safe-bottom));
}
.btn-generate {
  width: 100%;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 15px;
  padding: 13px;
  border-radius: 10px;
  border: none;
  background: var(--teal);
  color: #fff;
  cursor: pointer;
}
.btn-generate:disabled { background: var(--ink-faint); }
.count-hint { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(22,35,46,0.55);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-radius: 18px 18px 0 0;
  padding: 20px 18px calc(20px + var(--safe-bottom));
  max-height: 82vh;
  overflow-y: auto;
}
.sheet h2 { font-size: 17px; margin-bottom: 4px; }
.sheet p.sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; }
.link-box {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  word-break: break-all;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.msg-box {
  width: 100%;
  min-height: 130px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 12px;
}
.sheet-actions { display: flex; flex-direction: column; gap: 8px; }
.btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 500;
  font-size: 14px;
  padding: 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: block;
}
.btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn-coral { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn-close {
  background: none; border: none; color: var(--ink-faint);
  font-size: 13px; text-align: center; margin-top: 10px; width: 100%; padding: 6px; cursor: pointer;
}
.status-msg { text-align: center; font-size: 12px; color: var(--teal-deep); min-height: 16px; margin-top: 4px; }
</style>
</head>
<body>

<div id="app">

  <div class="top">
    <img src="icon-192.png" alt="HEAL" />
    <div>
      <h1>Pauta HEAL</h1>
      <p>Ejercicios de mantención para pacientes dados de alta</p>
    </div>
  </div>

  <div class="step-label">Paciente</div>
  <input type="text" id="p-nombre" placeholder="Nombre del paciente" />

  <div class="step-label">Zona corporal</div>
  <div class="chips" id="chips-zonas"></div>

  <div class="step-label" id="lbl-ejercicios" style="display:none;">Ejercicios</div>
  <div class="grid" id="grid-ejercicios"></div>
  <div class="empty" id="empty-zonas">Elige una o más zonas para ver los ejercicios.</div>

  <div class="step-label" id="lbl-seleccion" style="display:none;">Series y repeticiones</div>
  <div id="lista-seleccion"></div>

  <div class="step-label" id="lbl-nota" style="display:none;">Nota (opcional)</div>
  <div class="note-box" id="box-nota" style="display:none;">
    <textarea id="p-nota" placeholder="Ej: hacer 3 veces por semana, sin dolor"></textarea>
  </div>

</div>

<div class="bottom-bar">
  <div class="count-hint" id="count-hint"></div>
  <button class="btn-generate" id="btn-generar" disabled>Generar pauta y link</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>Pauta lista</h2>
    <p class="sub">Copia el mensaje y envíalo por WhatsApp o correo.</p>
    <div class="link-box" id="link-box"></div>
    <textarea class="msg-box" id="msg-box"></textarea>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="btn-copiar-link">Copiar link</button>
      <button class="btn btn-coral" id="btn-copiar-mensaje">Copiar mensaje completo</button>
    </div>
    <div class="status-msg" id="status-msg"></div>
    <button class="btn-close" id="btn-cerrar">Cerrar</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBhEqjUL53-d5gvbk0o3GxvaaoJaIgUnkQ",
  authDomain: "heal-pauta-ejercicios.firebaseapp.com",
  projectId: "heal-pauta-ejercicios",
  storageBucket: "heal-pauta-ejercicios.firebasestorage.app",
  messagingSenderId: "155339245316",
  appId: "1:155339245316:web:c812203e2152dd66cbf251"
};

const PAUTA_URL = 'https://healchile.github.io/Pautas-HEAL/pauta.html';

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch (e) {
  console.error('No se pudo conectar a Firebase', e);
}

const DEFAULT_ZONAS = ['Columna', 'Cadera', 'Rodilla', 'Tobillo', 'Hombro', 'Muñeca', 'Codo', 'Movilidad'];

let videos = [];
let zonasActivas = new Set();
let seleccionados = []; // { videoId, series, dosis }

const $ = (sel) => document.querySelector(sel);

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function zonasDisponibles() {
  const set = new Set(DEFAULT_ZONAS);
  videos.forEach(v => { if (v.categoria) set.add(v.categoria); });
  return Array.from(set);
}

function cargarVideos() {
  if (!db) { renderTodo(); return; }
  db.collection('videos').onSnapshot((snap) => {
    videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTodo();
  }, (err) => console.error('Error cargando biblioteca', err));
}

function renderTodo() {
  renderChips();
  renderGrid();
  renderSeleccion();
  actualizarBoton();
}

function renderChips() {
  const cont = $('#chips-zonas');
  cont.innerHTML = zonasDisponibles().map(z => `
    <div class="chip ${zonasActivas.has(z) ? 'active' : ''}" data-zona="${escapeHtml(z)}">${escapeHtml(z)}</div>
  `).join('');
}

function renderGrid() {
  const grid = $('#grid-ejercicios');
  const empty = $('#empty-zonas');
  const lbl = $('#lbl-ejercicios');

  if (zonasActivas.size === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'Elige una o más zonas para ver los ejercicios.';
    lbl.style.display = 'none';
    return;
  }

  const filtrados = videos.filter(v => zonasActivas.has(v.categoria));
  lbl.style.display = 'block';

  if (filtrados.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'No hay ejercicios cargados en esa zona todavía.';
    return;
  }

  empty.style.display = 'none';
  const idsSel = new Set(seleccionados.map(s => s.videoId));
  grid.innerHTML = filtrados.map(v => `
    <div class="ex-card ${idsSel.has(v.id) ? 'selected' : ''}" data-id="${v.id}">
      <div class="ex-check">✓</div>
      <div class="ex-thumb">▶</div>
      <div class="ex-name">${escapeHtml(v.nombre)}</div>
      <div class="ex-cat">${escapeHtml(v.categoria || '')}</div>
    </div>
  `).join('');
}

function renderSeleccion() {
  const lblSel = $('#lbl-seleccion');
  const lblNota = $('#lbl-nota');
  const boxNota = $('#box-nota');
  const cont = $('#lista-seleccion');

  if (seleccionados.length === 0) {
    lblSel.style.display = 'none';
    lblNota.style.display = 'none';
    boxNota.style.display = 'none';
    cont.innerHTML = '';
    return;
  }

  lblSel.style.display = 'block';
  lblNota.style.display = 'block';
  boxNota.style.display = 'block';

  cont.innerHTML = seleccionados.map((s, i) => {
    const v = videos.find(v => v.id === s.videoId);
    if (!v) return '';
    return `
    <div class="sel-row">
      <div class="name">${escapeHtml(v.nombre)}</div>
      <input class="dosis-input mono" data-idx="${i}" data-field="series" value="${escapeHtml(s.series)}" inputmode="numeric" />
      <span class="x">series ×</span>
      <input class="dosis-input mono" data-idx="${i}" data-field="dosis" value="${escapeHtml(s.dosis)}" style="width:60px;" />
      <button class="rm" data-idx="${i}">×</button>
    </div>`;
  }).join('');
}

function actualizarBoton() {
  const btn = $('#btn-generar');
  const hint = $('#count-hint');
  const n = seleccionados.length;
  const nombre = $('#p-nombre').value.trim();

  if (n === 0) {
    hint.textContent = 'Elige al menos un ejercicio.';
    btn.disabled = true;
  } else if (!nombre) {
    hint.textContent = `${n} ejercicio${n > 1 ? 's' : ''} elegido${n > 1 ? 's' : ''}. Falta el nombre del paciente.`;
    btn.disabled = true;
  } else {
    hint.textContent = `${n} ejercicio${n > 1 ? 's' : ''} para ${nombre}`;
    btn.disabled = false;
  }
}

// Toggle zona
$('#chips-zonas').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const z = chip.dataset.zona;
  if (zonasActivas.has(z)) zonasActivas.delete(z); else zonasActivas.add(z);
  renderChips();
  renderGrid();
});

// Toggle ejercicio
$('#grid-ejercicios').addEventListener('click', (e) => {
  const card = e.target.closest('.ex-card');
  if (!card) return;
  const id = card.dataset.id;
  const idx = seleccionados.findIndex(s => s.videoId === id);
  if (idx >= 0) {
    seleccionados.splice(idx, 1);
  } else {
    seleccionados.push({ videoId: id, series: '3', dosis: '12 rep' });
  }
  renderGrid();
  renderSeleccion();
  actualizarBoton();
});

// Editar series/dosis
$('#lista-seleccion').addEventListener('input', (e) => {
  const idx = e.target.dataset.idx;
  const field = e.target.dataset.field;
  if (idx === undefined) return;
  seleccionados[idx][field] = e.target.value;
});

$('#lista-seleccion').addEventListener('click', (e) => {
  const btn = e.target.closest('.rm');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  seleccionados.splice(idx, 1);
  renderGrid();
  renderSeleccion();
  actualizarBoton();
});

$('#p-nombre').addEventListener('input', actualizarBoton);

// --- Generación del link ---

function b64UrlEncode(str) {
  const b64 = btoa(unescape(encodeURIComponent(str)));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function extraerIdYoutube(url) {
  if (!url) return null;
  const patrones = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,
    /[?&]v=([a-zA-Z0-9_-]{6,})/
  ];
  for (const p of patrones) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function generarLink() {
  const nombre = $('#p-nombre').value.trim();
  const nota = $('#p-nota').value.trim();
  const ejercicios = seleccionados.map(s => {
    const v = videos.find(v => v.id === s.videoId);
    if (!v) return null;
    const ytId = extraerIdYoutube(v.url);
    const item = { n: v.nombre, s: s.series, d: s.dosis };
    if (ytId) item.y = ytId; else item.u = v.url;
    return item;
  }).filter(Boolean);

  const payload = { p: nombre, e: ejercicios };
  if (nota) payload.no = nota;

  const encoded = b64UrlEncode(JSON.stringify(payload));
  return PAUTA_URL + '?r=' + encoded;
}

function generarMensaje(link) {
  const nombre = $('#p-nombre').value.trim();
  return `Hola ${nombre}, aquí tu pauta de ejercicios de HEAL:\n${link}`;
}

$('#btn-generar').addEventListener('click', () => {
  const link = generarLink();
  const mensaje = generarMensaje(link);
  $('#link-box').textContent = link;
  $('#msg-box').value = mensaje;
  $('#status-msg').textContent = '';
  $('#overlay').classList.add('open');
});

$('#btn-cerrar').addEventListener('click', () => {
  $('#overlay').classList.remove('open');
});

$('#btn-copiar-link').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('#link-box').textContent);
    $('#status-msg').textContent = 'Link copiado.';
  } catch (e) {
    $('#status-msg').textContent = 'No se pudo copiar. Selecciona el texto manualmente.';
  }
});

$('#btn-copiar-mensaje').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('#msg-box').value);
    $('#status-msg').textContent = 'Mensaje copiado. Ya lo puedes pegar en WhatsApp o correo.';
  } catch (e) {
    $('#status-msg').textContent = 'No se pudo copiar. Selecciona el texto manualmente.';
  }
});

// Registrar service worker para que la app se pueda instalar
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

cargarVideos();
</script>
</body>
</html>
