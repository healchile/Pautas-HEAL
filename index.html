<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, Arial, sans-serif; background: #F5F6F2; color: #16232E; margin: 0; padding: 24px 16px 48px; }
  .contenedor { max-width: 640px; margin: 0 auto; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 4px; }
  .subtitulo { color: #55636D; font-size: 14px; margin-top: 0; margin-bottom: 28px; }
  .ejercicio { background: #fff; border: 1px solid #DCE1DA; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .ejercicio-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .numero { font-family: 'IBM Plex Mono', monospace; background: #E4F1EE; color: #0B4F45; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .ejercicio h2 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin: 0; }
  .dosis { font-family: 'IBM Plex Mono', monospace; color: #E2502F; font-size: 13px; margin: 2px 0 0; }
  .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #16232E; cursor: pointer; }
  .video-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .play-boton { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.92; }
  .link-video { display: inline-block; padding: 8px 14px; background: #0F6B5C; color: #fff; text-decoration: none; border-radius: 7px; font-size: 13.5px; }
  .error { text-align: center; padding: 60px 16px; color: #55636D; }
  .logo-heal { height: 34px; width: auto; margin-bottom: 18px; display: block; }
</style>

function b64UrlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return decodeURIComponent(escape(atob(str)));
}

function escapeHtml(s) {

function render() {
  const cont = document.getElementById('contenedor');
  const params = new URLSearchParams(window.location.search);
  const data = params.get('r');

  if (!data) {
    cont.innerHTML = `<img class="logo-heal" src="${LOGO_HEAL}" alt="HEAL" /><div class="error">Este link no tiene una rutina cargada.</div>`;
    return;
  }

  let rutina;
  try {
    rutina = JSON.parse(b64UrlDecode(data));
  } catch (e) {
    cont.innerHTML = '<div class="error">No se pudo leer esta rutina. Pide que te reenvíen el link.</div>';
    return;
  }

  const paciente = rutina.p || '';
  const ejercicios = rutina.e || [];

  const bloques = ejercicios.map((ex, i) => {
    const dosis = `${ex.s || '?'} series x ${ex.d || '?'}`;
    const media = ex.y
      ? `<div class="video-wrap" data-yt="${ex.y}" data-titulo="${escapeHtml(ex.n)}" onclick="reproducir(this)">
           <img src="https://img.youtube.com/vi/${ex.y}/hqdefault.jpg" alt="${escapeHtml(ex.n)}" loading="lazy" />
           <div class="play-boton"><svg viewBox="0 0 68 48" width="56"><path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z" fill="#212121" fill-opacity="0.8"></path><path d="M 45,24 27,14 27,34" fill="#fff"></path></svg></div>
         </div>`
      : `<a class="link-video" href="${escapeHtml(ex.u)}" target="_blank" rel="noopener">Ver video ↗</a>`;
    return `
      <section class="ejercicio">
        <div class="ejercicio-header">
          <span class="numero">${i + 1}</span>
          <div>
            <h2>${escapeHtml(ex.n)}</h2>
            <p class="dosis">${escapeHtml(dosis)}</p>
          </div>
        </div>
        ${media}
      </section>`;
  }).join('');

  cont.innerHTML = `
    <img class="logo-heal" src="${LOGO_HEAL}" alt="HEAL" />
    <h1>Ejercicios para continuar en casa</h1>
    <p class="subtitulo">${escapeHtml(paciente)}</p>
    ${bloques || '<div class="error">Esta rutina no tiene ejercicios.</div>'}
  `;
}

function reproducir(el) {
  const yt = el.dataset.yt;
  const titulo = el.dataset.titulo;
  el.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1" title="${titulo}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  el.onclick = null;
  el.style.cursor = 'default';
}

render();
</script>
